<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Red Bouquet</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020208;
}
canvas{
    display:block;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, dpr;

function resize(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    initScene();
}
window.addEventListener("resize", resize);

function rand(min, max){
    return Math.random() * (max - min) + min;
}

const stars = [];
const fireflies = [];
const flowers = [];

class Flower {
    constructor(x, scale = 1, offsetY = 0){
        this.x = x;
        this.baseY = h - 135 + offsetY;
        this.scale = scale;
        this.height = 0;
        this.maxHeight = 180 + Math.random() * 95;
        this.growSpeed = 0.8 + Math.random() * 1.05;
        this.bloom = 0;
        this.leafGrow = 0;

        this.leaves = [];
        for(let i = 0; i < 6; i++){
            this.leaves.push({
                y: 32 + i * 22,
                side: i % 2 === 0 ? -1 : 1,
                size: 0
            });
        }
    }

    update(){
        if(this.height < this.maxHeight){
            this.height += this.growSpeed;
        }else{
            this.bloom = Math.min(this.bloom + 0.013, 1);
        }

        this.leafGrow = Math.min(this.leafGrow + 0.02, 1);

        this.leaves.forEach(l => {
            l.size = Math.min(l.size + 0.022, 1);
        });
    }

    drawStem(){
        const stemGrad = ctx.createLinearGradient(this.x, this.baseY, this.x, this.baseY - this.height);
        stemGrad.addColorStop(0, "#2f8f4e");
        stemGrad.addColorStop(0.5, "#45b764");
        stemGrad.addColorStop(1, "#1f6a35");

        ctx.strokeStyle = stemGrad;
        ctx.lineWidth = 7 * this.scale;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo(this.x, this.baseY);
        ctx.quadraticCurveTo(
            this.x - 18 * this.scale,
            this.baseY - this.height * 0.45,
            this.x,
            this.baseY - this.height
        );
        ctx.stroke();
    }

    drawLeaves(){
        this.leaves.forEach((leaf) => {
            const y = this.baseY - leaf.y;
            const side = leaf.side;

            ctx.save();
            ctx.translate(this.x, y);
            ctx.rotate(side * 0.7);
            ctx.scale(leaf.size * this.scale, leaf.size * this.scale);

            const grad = ctx.createLinearGradient(0, 0, 50, 0);
            grad.addColorStop(0, "#7ee08d");
            grad.addColorStop(0.6, "#2f9d47");
            grad.addColorStop(1, "#1d5f2c");

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(side * 24, 0, 28, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        });
    }

    drawFlowerHead(){
        const topY = this.baseY - this.height;

        ctx.save();
        ctx.translate(this.x, topY);
        ctx.scale(this.bloom * this.scale, this.bloom * this.scale);

        const petalCount = 8;
        const petalSize = 42;

        for(let i = 0; i < petalCount; i++){
            ctx.save();
            ctx.rotate((Math.PI * 2 / petalCount) * i);

            const petalGrad = ctx.createRadialGradient(0, 0, 5, 0, -petalSize, petalSize);
            petalGrad.addColorStop(0, "#ffe1e7");
            petalGrad.addColorStop(0.45, "#ff5d78");
            petalGrad.addColorStop(1, "#9f0029");

            ctx.fillStyle = petalGrad;
            ctx.beginPath();
            ctx.ellipse(0, -petalSize, 18, 42, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        const centerGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 18);
        centerGrad.addColorStop(0, "#fff2a6");
        centerGrad.addColorStop(1, "#e6b800");

        ctx.fillStyle = centerGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    drawGlow(){
        const topY = this.baseY - this.height;

        const glow = ctx.createRadialGradient(this.x, topY, 0, this.x, topY, 110);
        glow.addColorStop(0, "rgba(255,70,110,.22)");
        glow.addColorStop(1, "rgba(255,70,110,0)");

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(this.x, topY, 110, 0, Math.PI * 2);
        ctx.fill();
    }

    draw(){
        this.drawGlow();
        this.drawStem();
        this.drawLeaves();
        this.drawFlowerHead();
    }
}

function initScene(){
    stars.length = 0;
    fireflies.length = 0;
    flowers.length = 0;

    for(let i = 0; i < 190; i++){
        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: rand(0.6, 1.8),
            baseA: rand(0.18, 0.8),
            speed: rand(0.002, 0.008),
            phase: rand(0, Math.PI * 2)
        });
    }

    for(let i = 0; i < 45; i++){
        fireflies.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: rand(1.2, 2.8),
            speed: rand(0.12, 0.45),
            phase: rand(0, Math.PI * 2),
            drift: rand(-0.15, 0.15)
        });
    }

    const center = w / 2;

    const positions = [
        center - 210,
        center - 165,
        center - 120,
        center - 78,
        center - 35,
        center + 5,
        center + 45,
        center + 90,
        center + 135,
        center + 180
    ];

    const scales = [0.88, 0.95, 0.92, 1.0, 1.05, 1.0, 0.98, 1.03, 0.94, 0.9];
    const offsets = [0, -10, 5, -12, 8, -6, 10, -4, 6, -8];

    positions.forEach((x, index) => {
        flowers.push(new Flower(x, scales[index], offsets[index]));
    });
}

function drawBackground(){
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#050816");
    bg.addColorStop(0.33, "#120b2a");
    bg.addColorStop(0.68, "#2b1030");
    bg.addColorStop(1, "#13050d");

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    const moon = ctx.createRadialGradient(w * 0.8, h * 0.18, 0, w * 0.8, h * 0.18, 220);
    moon.addColorStop(0, "rgba(255,245,255,.28)");
    moon.addColorStop(1, "rgba(255,245,255,0)");

    ctx.fillStyle = moon;
    ctx.beginPath();
    ctx.arc(w * 0.8, h * 0.18, 220, 0, Math.PI * 2);
    ctx.fill();

    const mist = ctx.createRadialGradient(w * 0.5, h * 0.98, 30, w * 0.5, h * 0.98, 560);
    mist.addColorStop(0, "rgba(255,80,150,.16)");
    mist.addColorStop(0.5, "rgba(255,80,150,.06)");
    mist.addColorStop(1, "rgba(255,80,150,0)");

    ctx.fillStyle = mist;
    ctx.fillRect(0, 0, w, h);
}

function drawGroundGlow(){
    const g = ctx.createRadialGradient(w / 2, h, 40, w / 2, h, 400);
    g.addColorStop(0, "rgba(255,80,130,.2)");
    g.addColorStop(0.5, "rgba(255,80,130,.08)");
    g.addColorStop(1, "rgba(255,80,130,0)");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
}

function drawStars(time){
    for(const s of stars){
        const twinkle = 0.78 + Math.sin(time * s.speed + s.phase) * 0.22;
        const alpha = Math.max(0.05, s.baseA * twinkle);

        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawFireflies(time){
    for(const f of fireflies){
        f.y -= f.speed;
        f.x += Math.sin(time * 0.001 + f.phase) * f.drift;

        if(f.y < -10){
            f.y = h + 10;
            f.x = Math.random() * w;
        }

        if(f.x < -10) f.x = w + 10;
        if(f.x > w + 10) f.x = -10;

        const a = 0.35 + Math.sin(time * 0.0022 + f.phase) * 0.22;

        ctx.fillStyle = `rgba(255,230,120,${a})`;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawBouquetBase(){
    const x = w / 2;
    const y = h - 120;

    const shadow = ctx.createRadialGradient(x, y + 120, 10, x, y + 120, 170);
    shadow.addColorStop(0, "rgba(0,0,0,.35)");
    shadow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = shadow;
    ctx.beginPath();
    ctx.ellipse(x, y + 118, 175, 35, 0, 0, Math.PI * 2);
    ctx.fill();

    const wrap = ctx.createLinearGradient(x - 120, y, x + 120, y + 140);
    wrap.addColorStop(0, "#ffd7e6");
    wrap.addColorStop(0.45, "#fff7fa");
    wrap.addColorStop(1, "#f39ab8");

    ctx.fillStyle = wrap;
    ctx.beginPath();
    ctx.beginPath();
    ctx.moveTo(x - 160, y - 40);
    ctx.lineTo(x - 90, y + 190);
    ctx.lineTo(x + 90, y + 190);
    ctx.lineTo(x + 160, y - 40);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#ffadc7";
    ctx.lineWidth = 3;
    ctx.stroke();

    const ribbon = ctx.createLinearGradient(x - 90, y + 90, x + 90, y + 90);
    ribbon.addColorStop(0, "#ff4f7d");
    ribbon.addColorStop(0.5, "#ff91b1");
    ribbon.addColorStop(1, "#d53c66");

    ctx.fillStyle = ribbon;
    ctx.beginPath();
    ctx.ellipse(x, y + 85, 55, 25, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x-25,y+95);
    ctx.lineTo(x-50,y+155);
    ctx.lineTo(x-10,y+120);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x+25,y+95);
    ctx.lineTo(x+50,y+155);
    ctx.lineTo(x+10,y+120);
    ctx.closePath();
    ctx.fill();
}

function animate(time){
    drawBackground();
    drawGroundGlow();
    drawStars(time);
    drawFireflies(time);

    flowers.forEach(f => {
    f.update();
    f.drawStem();
    f.drawLeaves();
    });

    drawBouquetBase();

    flowers.forEach(f => {
        f.drawGlow();
        f.drawFlowerHead();
    });

    requestAnimationFrame(animate);
}

resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
