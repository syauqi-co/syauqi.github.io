<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Red Bloom Flowers</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020208;
}
canvas{
    display:block;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, dpr;

function resize(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    initScene();
}
window.addEventListener("resize", resize);

function rand(min, max){
    return Math.random() * (max - min) + min;
}

const stars = [];
const fireflies = [];
const flowers = [];

class Flower {
    constructor(x, scale = 1){
        this.x = x;
        this.baseY = h - 20;
        this.scale = scale;

        this.height = 0;
        this.maxHeight = rand(h * 0.22, h * 0.42);
        this.growSpeed = rand(0.8, 1.35);

        this.bloom = 0;
        this.stemWave = rand(0.8, 1.8);
        this.stemPhase = rand(0, Math.PI * 2);

        this.leafProgress = 0;
        this.leaves = [];
        for(let i = 0; i < 7; i++){
            this.leaves.push({
                y: 35 + i * 24,
                side: i % 2 === 0 ? -1 : 1,
                size: 0,
                angle: rand(-0.15, 0.15)
            });
        }
    }

    update(){
        if(this.height < this.maxHeight){
            this.height += this.growSpeed;
        } else {
            this.bloom = Math.min(this.bloom + 0.012, 1);
        }

        this.leafProgress = Math.min(this.leafProgress + 0.02, 1);

        this.leaves.forEach(leaf => {
            leaf.size = Math.min(leaf.size + 0.02, 1);
        });
    }

    getTopY(){
        return this.baseY - this.height;
    }

    drawStem(){
        const topY = this.getTopY();
        const sway = Math.sin(performance.now() * 0.001 + this.stemPhase) * this.stemWave * 8;

        const stemGrad = ctx.createLinearGradient(this.x, this.baseY, this.x + sway, topY);
        stemGrad.addColorStop(0, "#2a7a43");
        stemGrad.addColorStop(0.5, "#3cb25f");
        stemGrad.addColorStop(1, "#16512a");

        ctx.strokeStyle = stemGrad;
        ctx.lineWidth = 6 * this.scale;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo(this.x, this.baseY);
        ctx.quadraticCurveTo(
            this.x + sway * 0.45,
            this.baseY - this.height * 0.45,
            this.x + sway,
            topY
        );
        ctx.stroke();
    }

    drawLeaves(){
        this.leaves.forEach((leaf) => {
            const y = this.baseY - leaf.y;
            const side = leaf.side;
            const sway = Math.sin(performance.now() * 0.001 + this.stemPhase) * this.stemWave * 5;

            ctx.save();
            ctx.translate(this.x + sway * (leaf.y / this.maxHeight) * 0.4, y);
            ctx.rotate(side * 0.72 + leaf.angle);
            ctx.scale(leaf.size * this.scale, leaf.size * this.scale);

            const grad = ctx.createLinearGradient(0, 0, 60, 0);
            grad.addColorStop(0, "#95e6a1");
            grad.addColorStop(0.6, "#38a64d");
            grad.addColorStop(1, "#1c5e2f");

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(side * 24, 0, 28, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        });
    }

    drawFlowerHead(){
        const topY = this.getTopY();

        ctx.save();
        ctx.translate(this.x, topY);
        ctx.scale(this.bloom * this.scale, this.bloom * this.scale);

        const petalCount = 9;
        const petalSize = 44;

        for(let i = 0; i < petalCount; i++){
            ctx.save();
            ctx.rotate((Math.PI * 2 / petalCount) * i);

            const petalGrad = ctx.createRadialGradient(0, 0, 4, 0, -petalSize, petalSize);
            petalGrad.addColorStop(0, "#ffe1e7");
            petalGrad.addColorStop(0.4, "#ff5b73");
            petalGrad.addColorStop(1, "#980021");

            ctx.fillStyle = petalGrad;
            ctx.beginPath();
            ctx.ellipse(0, -petalSize, 18, 44, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        const centerGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 18);
        centerGrad.addColorStop(0, "#fff6b3");
        centerGrad.addColorStop(1, "#e2b400");

        ctx.fillStyle = centerGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    drawGlow(){
        const topY = this.getTopY();
        const glow = ctx.createRadialGradient(this.x, topY, 0, this.x, topY, 110);
        glow.addColorStop(0, "rgba(255,70,110,.22)");
        glow.addColorStop(1, "rgba(255,70,110,0)");

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(this.x, topY, 110, 0, Math.PI * 2);
        ctx.fill();
    }

    draw(){
        this.drawGlow();
        this.drawStem();
        this.drawLeaves();
        this.drawFlowerHead();
    }
}

function initScene(){
    stars.length = 0;
    fireflies.length = 0;
    flowers.length = 0;

    for(let i = 0; i < 190; i++){
        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: rand(0.5, 1.7),
            baseA: rand(0.12, 0.7),
            speed: rand(0.0015, 0.006),
            phase: rand(0, Math.PI * 2)
        });
    }

    for(let i = 0; i < 45; i++){
        fireflies.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: rand(1.2, 2.8),
            speed: rand(0.12, 0.45),
            phase: rand(0, Math.PI * 2),
            drift: rand(-0.15, 0.15)
        });
    }

    const count = 11;
    const center = w / 2;
    const span = 420;

    for(let i = 0; i < count; i++){
        const t = count === 1 ? 0.5 : i / (count - 1);
        const x = center - span / 2 + t * span;
        const scale = 0.82 + Math.random() * 0.28;
        flowers.push(new Flower(x, scale));
    }

    flowers.sort((a, b) => a.x - b.x);
}

function drawBackground(){
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#050816");
    bg.addColorStop(0.33, "#120b2a");
    bg.addColorStop(0.68, "#2b1030");
    bg.addColorStop(1, "#13050d");

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    const moon = ctx.createRadialGradient(w * 0.82, h * 0.18, 0, w * 0.82, h * 0.18, 220);
    moon.addColorStop(0, "rgba(255,245,255,.28)");
    moon.addColorStop(1, "rgba(255,245,255,0)");

    ctx.fillStyle = moon;
    ctx.beginPath();
    ctx.arc(w * 0.82, h * 0.18, 220, 0, Math.PI * 2);
    ctx.fill();

    const mist = ctx.createRadialGradient(w * 0.5, h * 0.98, 30, w * 0.5, h * 0.98, 560);
    mist.addColorStop(0, "rgba(255,80,150,.16)");
    mist.addColorStop(0.5, "rgba(255,80,150,.06)");
    mist.addColorStop(1, "rgba(255,80,150,0)");

    ctx.fillStyle = mist;
    ctx.fillRect(0, 0, w, h);
}

function drawGroundGlow(){
    const g = ctx.createRadialGradient(w / 2, h, 40, w / 2, h, 420);
    g.addColorStop(0, "rgba(255,80,130,.2)");
    g.addColorStop(0.5, "rgba(255,80,130,.08)");
    g.addColorStop(1, "rgba(255,80,130,0)");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
}

function drawStars(time){
    for(const s of stars){
        const twinkle = 0.8 + Math.sin(time * s.speed + s.phase) * 0.2;
        const alpha = Math.max(0.05, s.baseA * twinkle);

        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawFireflies(time){
    for(const f of fireflies){
        f.y -= f.speed;
        f.x += Math.sin(time * 0.001 + f.phase) * f.drift;

        if(f.y < -10){
            f.y = h + 10;
            f.x = Math.random() * w;
        }

        if(f.x < -10) f.x = w + 10;
        if(f.x > w + 10) f.x = -10;

        const a = 0.34 + Math.sin(time * 0.0022 + f.phase) * 0.2;

        ctx.fillStyle = `rgba(255,230,120,${a})`;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function animate(time){
    drawBackground();
    drawGroundGlow();
    drawStars(time);
    drawFireflies(time);

    flowers.forEach(f => {
        f.update();
        f.draw();
    });

    requestAnimationFrame(animate);
}

resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
